[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_core"
version = "0.1.0"
description = "AI Core: LangGraph agent + RAG + guardrails cho hệ thống tầm soát ung thư"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "chromadb>=0.5",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
openai = ["langchain-openai>=0.2"]
ollama = ["langchain-ollama>=0.2"]
local-embed = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["ai_core*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]  # str+Enum có chủ đích: serialise JSON & so sánh chuỗi

[tool.pytest.ini_options]
testpaths = ["tests"]
